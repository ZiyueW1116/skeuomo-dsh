name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  macos:
    name: macOS / build and desk checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查工作流
        run: pnpm exec vitest run scripts/ci-workflow.spec.ts

      - name: 构建
        run: pnpm run build

      - name: 检查代码
        run: pnpm run lint

      - name: 检查文档
        run: pnpm run doc-sync

      - name: 验证界面与会话交互
        run: pnpm run test:gui

      - name: 安装测试浏览器
        run: pnpm --dir apps/web exec playwright install chromium

      - name: 回放书桌交互
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/study-desk.e2e.ts

      - name: 构建本机窗口
        run: python3 scripts/study-macos/build.py
